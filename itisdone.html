<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="5; url=index.html">
  <title>ОТПРАВЛЕНО</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Tahoma', 'Arial', sans-serif;
      font-size: 20px;
      line-height: 1.8;
      padding: 40px 20px;
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .text {
      width: 100%;
      max-width: 560px;
    }

    .text p {
      margin-bottom: 1.2em;
    }

    .text p:last-child {
      margin-bottom: 0;
    }

    @media (max-width: 600px) {
      body {
        font-size: 16px;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="text">
    <p>СООБЩЕНИЕ УСПЕШНО ОТПРАВЛЕНО</p>
  </div>

</body>
</html>
