<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta content="noindex, nofollow" name="robots"/>
  <title>ВАШЕ СЛОВО</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Tahoma', 'Arial', sans-serif;
      font-size: 20px;
      line-height: 1.5;
      padding: 40px 20px;
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .text {
      width: 100%;
      text-align: center;
      margin-bottom: 3em;
    }

    .text p {
      margin-bottom: 1.2em;
    }

    .form-box {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    textarea {
      width: 100%;
      padding: 16px;
      font-family: 'Verdana', 'Arial', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #e0e0e0;
      background: transparent;
      border: 1px solid #444;
      border-radius: 0;
      resize: vertical;
      min-height: 180px;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #e0e0e0;
    }

    .submit-wrap {
      margin-top: 1.2em;
      text-align: right;
    }

    button {
      padding: 10px 32px;
      font-family: 'Verdana', 'Arial', sans-serif;
      font-size: 16px;
      color: #0d0d0d;
      background-color: #e0e0e0;
      border: none;
      border-radius: 0;
      cursor: pointer;
      transition: background-color 0.2s;
      letter-spacing: 0.5px;
    }

    button:hover {
      background-color: #aaaaaa;
    }
	
    @media (max-width: 600px) {
      body {
        font-size: 16px;
        padding: 20px 16px;
      }

      .text p {
        margin-bottom: 1em;
      }

      textarea {
        font-size: 16px;
        padding: 14px;
        min-height: 140px;
      }

      .submit-wrap {
        text-align: center;
        margin-top: 1em;
      }

      button {
        width: 100%;
        padding: 14px 20px;
        font-size: 17px;
        letter-spacing: 1px;
      }
    }

    @media (max-width: 380px) {
      body {
        padding: 16px 12px;
        font-size: 15px;
      }

      textarea {
        padding: 12px;
        min-height: 120px;
        font-size: 15px;
      }

      button {
        padding: 12px 16px;
        font-size: 16px;
      }
    }

    @media (max-width: 600px) {
      body {
        font-size: 16px;
        padding: 20px 16px;
      }
      textarea {
        font-size: 15px;
        padding: 14px;
        min-height: 150px;
      }
      button {
        width: 100%;
      }
      .submit-wrap {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="text">
    <p>В случае, если вы вдумчиво прочли наше обращение до конца и у вас есть, что сказать — вы можете написать нам. Мы это увидим.</p>
    <p>Вы можете оставить свои контактные данные, какие сами пожелаете. Так, в случае если наше видение схоже, мы сможем связаться с вами, если сочтем это нужным.</p>
  </div>

  <div class="form-box">
    <form action="https://formspree.io/f/xzebvkoy" method="POST">
	<input type="hidden" name="_redirect" value="https://fadedsense11.github.io/itisdone.html">
      <textarea name="message" placeholder="—" maxlength="10000"></textarea>
      <div class="submit-wrap">
        <button type="submit">Отправить</button>
      </div>
    </form>
  </div>

</body>
</html>
